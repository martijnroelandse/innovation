name: Keep vote database active
# Free Supabase projects pause after a week without traffic. A read every three days keeps the vote ready for 8 December.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST https://zlttzpjnvuuisghymxqe.supabase.co/rest/v1/rpc/vote_counts \
            -H "apikey: sb_publishable_LYmSgHVqO_OFZSpjQmqV5w_u9thtaVN" \
            -H "Content-Type: application/json" -d '{}'
