name: Keep vote database active
# Free Supabase projects pause after a week without enough traffic.
# Twice a day, run the vote-totals query on the database three times, so the database sees real queries.
# A failed request makes the run fail, and GitHub then sends an email.
on:
  schedule:
    - cron: '17 6 * * *'
    - cron: '47 17 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          URL=https://zlttzpjnvuuisghymxqe.supabase.co/rest/v1
          KEY=sb_publishable_LYmSgHVqO_OFZSpjQmqV5w_u9thtaVN
          for i in 1 2 3; do
            curl -fsS --retry 3 --retry-delay 10 -X POST "$URL/rpc/vote_counts" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
            echo
            sleep 5
          done
